name: Merge when green
description: Merge labelled pull requests once a required check passes, without GitHub's own auto-merge or branch protection.
author: ExaDev
branding:
  icon: git-merge
  color: green

inputs:
  required-check:
    description: Name of the check run that must have succeeded on the pull request's head commit. Point it at one aggregate job that needs every other job.
    required: true
  label:
    description: Label that opts a pull request in.
    default: automerge
  merge-method:
    description: rebase, squash, merge (through the API, which needs a token) or fast-forward (a push of the head commit to the base branch, with a token or a deploy key).
    default: rebase
  merge-token:
    description: An API token that performs the merge, a personal access token or a GitHub App installation token.
  app-id:
    description: A GitHub App's id, as an alternative to merge-token; an installation token is minted for this repository.
  app-private-key:
    description: The private key of the GitHub App named by app-id.
  ssh-key:
    description: Private half of a write deploy key, for merge-method fast-forward. Give at most one of merge-token, app-id and ssh-key.
  update-behind:
    description: For fast-forward, rebase a pull request that is behind its base onto it and push the result to its branch (never a fork's).
    default: "false"
  read-token:
    description: Token used to read pull requests, checks and review threads.
    default: ${{ github.token }}
  head-sha:
    description: Commit to act on. Defaults to the head of the workflow_run or pull_request_target event.
    default: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}

runs:
  using: composite
  steps:
    - uses: ExaDev/merge-when@v1
      with:
        when: |
          label: ${{ inputs.label }}
          check: ${{ inputs.required-check }}
          not-draft
          threads-resolved
        merge-method: ${{ inputs.merge-method }}
        merge-token: ${{ inputs.merge-token }}
        app-id: ${{ inputs.app-id }}
        app-private-key: ${{ inputs.app-private-key }}
        ssh-key: ${{ inputs.ssh-key }}
        update-behind: ${{ inputs.update-behind }}
        read-token: ${{ inputs.read-token }}
        head-sha: ${{ inputs.head-sha }}
