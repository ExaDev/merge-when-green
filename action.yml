name: Merge when green
description: Merge labelled pull requests once a required check passes, where GitHub's own auto-merge is unavailable.
author: ExaDev
branding:
  icon: git-merge
  color: green

inputs:
  merge-token:
    description: Token used to merge through the API (rebase, squash or merge). A token other than the workflow's GITHUB_TOKEN is needed when the merge must start further workflows, which GitHub does not do for pushes made with GITHUB_TOKEN. Not used for the fast-forward method.
  ssh-key:
    description: Private half of a write deploy key, used for the fast-forward method, which merges by pushing the pull request's head commit to its base branch over SSH. Pushes made with a deploy key start workflows. Not used for the other methods.
  read-token:
    description: Token used to read pull requests, checks and review threads.
    default: ${{ github.token }}
  label:
    description: Label that opts a pull request in.
    default: automerge
  required-check:
    description: Name of the check run that must have succeeded on the pull request's head commit. Point it at one aggregate job that needs every other job.
    required: true
  merge-method:
    description: rebase, squash, merge (all through the API, with merge-token) or fast-forward (a push over SSH, with ssh-key; only a pull request already up to date with its base is merged).
    default: rebase
  head-sha:
    description: Commit to act on. Defaults to the head of the workflow_run or pull_request_target event.
    default: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.read-token }}
        MERGE_TOKEN: ${{ inputs.merge-token }}
        SSH_KEY: ${{ inputs.ssh-key }}
        REPO: ${{ github.repository }}
        HEAD_SHA: ${{ inputs.head-sha }}
        LABEL: ${{ inputs.label }}
        REQUIRED_CHECK: ${{ inputs.required-check }}
        MERGE_METHOD: ${{ inputs.merge-method }}
      run: ${{ github.action_path }}/merge.sh
